name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild daily so Raider.IO data stays fresh
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
      # Runs on the Node version withastro/action just set up
      - run: npm test

  deploy:
    # PRs only run the build as a check; publishing happens from main
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only one deploy at a time; PR builds stay outside so they never queue or get cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
